<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <main class="dashboard">

      <!-- Section 1: Greeting & Clock -->
      <section class="section" id="section-clock" aria-label="Clock and greeting">
        <button id="settings-btn" aria-label="Open settings">&#9881;</button>
        <p id="greeting"></p>
        <p id="clock"></p>
        <p id="date"></p>

        <!-- Settings panel (hidden by default) -->
        <div id="settings-panel" hidden>
          <label for="name-input" class="settings-label">Your name</label>
          <div class="settings-row">
            <input type="text" id="name-input" placeholder="Enter your name..." aria-label="Your name" maxlength="50" />
            <button id="name-save-btn">Save</button>
            <button id="name-cancel-btn" class="btn-secondary">Cancel</button>
          </div>
          <div class="settings-row settings-theme-row">
            <span class="settings-label" style="margin:0">Theme</span>
            <button id="theme-toggle-btn" aria-label="Toggle dark mode">🌙 Dark Mode</button>
          </div>
          <div class="settings-row settings-theme-row">
            <label for="duration-input" class="settings-label" style="margin:0">Focus duration (min)</label>
            <input type="number" id="duration-input" min="1" max="180" value="25" aria-label="Focus timer duration in minutes" style="width:5rem" />
            <button id="duration-save-btn">Set</button>
          </div>
        </div>
      </section>

      <!-- Section 2: Focus Timer -->
      <section class="section" id="section-timer" aria-label="Focus timer">
        <h2>Focus Timer</h2>
        <p id="timer-display">25:00</p>
        <div class="timer-controls">
          <button id="timer-start">Start</button>
          <button id="timer-stop" disabled>Stop</button>
          <button id="timer-reset">Reset</button>
        </div>
      </section>

      <!-- Section 3: To-Do List -->
      <section class="section" id="section-todo" aria-label="To-do list">
        <h2>To-Do List</h2>
        <div class="input-row">
          <input type="text" id="todo-input" placeholder="Add a new task..." aria-label="New task" />
          <button id="todo-add">Add</button>
        </div>
        <div class="sort-row">
          <label for="todo-sort" class="sort-label">Sort:</label>
          <select id="todo-sort" aria-label="Sort tasks">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">A–Z</option>
            <option value="za">Z–A</option>
          </select>
        </div>
        <ul id="todo-list" aria-live="polite"></ul>
      </section>

      <!-- Section 4: Quick Links -->
      <section class="section" id="section-links" aria-label="Quick links">
        <h2>Quick Links</h2>
        <div class="input-row">
          <input type="text" id="link-name" placeholder="Link name" aria-label="Link name" />
          <input type="url"  id="link-url"  placeholder="https://..."  aria-label="URL" />
          <button id="link-add">Add</button>
        </div>
        <ul id="links-list" aria-live="polite"></ul>
      </section>

    </main>

    <div id="notification" aria-live="polite" aria-atomic="true"></div>

    <script src="js/script.js"></script>
  </body>
</html>
